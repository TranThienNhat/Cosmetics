name: Keep Render Backend Alive

on:
  schedule:
    # Chạy mỗi 12 phút (Render sleep sau 15 phút không có request)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Sending ping to Render Backend..."
          curl -sS -I --max-time 30 https://cosmetics-zdua.onrender.com/api/health || echo "Ping failed or server waking up"
